name: BT磁力下载

on:
  workflow_dispatch:
    inputs:
      magnet1:
        description: '磁力链接1 (magnet:?xt=urn:btih:...)'
        required: false
        type: string
      magnet2:
        description: '磁力链接2 (magnet:?xt=urn:btih:...)'
        required: false
        type: string

env:
  INPUT_MAGNET1: ${{ github.event.inputs.magnet1 }}
  INPUT_MAGNET2: ${{ github.event.inputs.magnet2 }}

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 aria2
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q aria2 zip
          aria2c --version | head -2

      - name: 环境诊断
        env:
          INPUT_MAGNET1: ${{ github.event.inputs.magnet1 }}
          INPUT_MAGNET2: ${{ github.event.inputs.magnet2 }}
        run: |
          echo "=== env 诊断 ==="
          echo "magnet1=${{ github.event.inputs.magnet1 }}"
          echo "magnet2=${{ github.event.inputs.magnet2 }}"
          echo "INPUT_MAGNET1=$INPUT_MAGNET1"
          echo "INPUT_MAGNET2=$INPUT_MAGNET2"
          echo "python: $(python3 --version 2>&1)"
          echo "aria2: $(aria2c --version 2>&1 | head -1)"
          echo "disk: $(df -h . | tail -1)"
          mkdir -p diag
          echo "magnet1=${{ github.event.inputs.magnet1 }}" > diag/inputs.txt
          echo "magnet2=${{ github.event.inputs.magnet2 }}" >> diag/inputs.txt
          echo "=== bt_runner.py 检查 ==="
          ls -la bt_runner.py && head -5 bt_runner.py

      - name: aria2 冒烟测试
        run: |
          echo "=== aria2 版本 ==="
          aria2c --version | head -2
          echo "=== HTTP 下载测试 (1MB) ==="
          mkdir -p /tmp/smoke
          timeout 60 aria2c --dir=/tmp/smoke -o test.bin \
            --console-log-level=error --summary-interval=0 \
            --max-download-limit=200K \
            "http://speedtest.tele2.net/1MB.zip" 2>&1 | tail -5
          echo "SMOKE_EXIT=$?"
          ls -la /tmp/smoke/
          echo "=== 磁力元数据获取测试 (60秒) ==="
          timeout 60 aria2c --dir=/tmp/smoke \
            --enable-dht=true --dht-listen-port=6881-6999 \
            --dht-entry-point=router.bittorrent.com:6881 \
            --enable-peer-exchange=true \
            --bt-tracker="udp://tracker.opentrackr.org:1337/announce" \
            --bt-metadata-only=true --bt-save-metadata=true \
            --console-log-level=error --summary-interval=0 \
            "magnet:?xt=urn:btih:963fd90eee4db809ed4224d1ca7a0639c443cf4b" 2>&1 | tail -5
          echo "META_EXIT=$?"
          ls -la /tmp/smoke/

      - name: 运行下载
        env:
          INPUT_MAGNET1: ${{ github.event.inputs.magnet1 }}
          INPUT_MAGNET2: ${{ github.event.inputs.magnet2 }}
        run: |
          set +e
          mkdir -p out
          TRACKERS="udp://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://tracker.openbittorrent.com:6969/announce,udp://exodus.desync.com:6969/announce,udp://tracker.torrent.eu.org:451/announce,http://tracker.opentrackr.org:1337/announce,https://tracker.gbitt.info:443/announce,http://tracker.gbitt.info:80/announce"
          i=1
          for mag in "$INPUT_MAGNET1" "$INPUT_MAGNET2"; do
            [ -z "$mag" ] && continue
            mkdir -p out/task$i
            echo "=== 任务$i 开始: ${mag:0:60} ==="
            timeout 150 aria2c --dir=out/task$i               --enable-dht=false --enable-peer-exchange=false --bt-enable-lpd=false               --bt-tracker="$TRACKERS"               --max-connection-per-server=8 --split=8 --bt-max-peers=50               --seed-time=0 --bt-save-metadata=true               --console-log-level=error --summary-interval=0               "$mag"
            echo "任务$i aria2退出码: $? (124=超时)"
            du -sh out/task$i 2>/dev/null
            i=$((i+1))
          done
          echo "=== out 目录 ==="
          ls -laR out/ 2>/dev/null | head -60 || echo "(out 不存在)"
          echo "=== parts 目录 ==="
          ls -la parts/ 2>/dev/null || echo "(无分卷)"
          exit 0

      - name: 上传诊断日志
        if: always()
        run: |
          mkdir -p diag
          # 把当前步骤日志打包（如果存在）
          echo "magnet1=${{ github.event.inputs.magnet1 }}" > diag/inputs.txt
          echo "magnet2=${{ github.event.inputs.magnet2 }}" >> diag/inputs.txt
          ls -laR out/ >> diag/inputs.txt 2>&1 || true
          echo "--- bt.py 是否存在 ---" >> diag/inputs.txt
          ls -la bt.py >> diag/inputs.txt 2>&1 || echo "bt.py 不存在" >> diag/inputs.txt
          echo "--- manifest ---" >> diag/inputs.txt
          cat out/manifest.json >> diag/inputs.txt 2>&1 || echo "(无 manifest)" >> diag/inputs.txt

      - name: 上传诊断 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt-diagnostics
          path: diag/
          retention-days: 7

      - name: 上传 artifact（整体）
        if: always() && hashFiles('parts/*') == ''
        uses: actions/upload-artifact@v4
        with:
          name: bt-files
          path: out/
          retention-days: 7

      - name: 上传分卷 z01
        if: always() && hashFiles('parts/bt.z01')
        uses: actions/upload-artifact@v4
        with:
          name: bt-part1
          path: parts/bt.z01
          retention-days: 7

      - name: 上传分卷 z02
        if: always() && hashFiles('parts/bt.z02')
        uses: actions/upload-artifact@v4
        with:
          name: bt-part2
          path: parts/bt.z02
          retention-days: 7

      - name: 上传分卷 z03
        if: always() && hashFiles('parts/bt.z03')
        uses: actions/upload-artifact@v4
        with:
          name: bt-part3
          path: parts/bt.z03
          retention-days: 7

      - name: 上传分卷 zip
        if: always() && hashFiles('parts/bt.zip')
        uses: actions/upload-artifact@v4
        with:
          name: bt-partZ
          path: parts/bt.zip
          retention-days: 7
