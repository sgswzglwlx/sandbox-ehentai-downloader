name: iwara 页面截图

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'iwara 视频URL列表（用 | 分隔）'
        required: true
        type: string

env:
  INPUT_URLS: ${{ github.event.inputs.urls }}

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: pip install -q playwright && (npx playwright install chromium --with-deps 2>/dev/null || python3 -m playwright install chromium --with-deps 2>/dev/null || true)

      - name: Playwright 截图
        run: |
          mkdir -p out
          cat > shot.py << 'PYEOF'
          import os, re
          from playwright.sync_api import sync_playwright

          urls = [u.strip() for u in os.environ['INPUT_URLS'].split('|') if u.strip()]
          print(f'待截图 {len(urls)} 个页面')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox'])
              # 桌面视口
              ctx = browser.new_context(viewport={'width': 1280, 'height': 900},
                  user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36')
              page = ctx.new_page()
              for i, url in enumerate(urls):
                  vid = re.search(r'/video/([a-zA-Z0-9]+)', url)
                  name = vid.group(1) if vid else f'video_{i}'
                  try:
                      page.goto(url, timeout=45000, wait_until='networkidle')
                      page.wait_for_timeout(4000)
                      # 滚动页面确保内容加载
                      page.mouse.wheel(0, 600)
                      page.wait_for_timeout(1500)
                      page.screenshot(path=f'out/{name}.png', full_page=False)
                      # 提取标题
                      title = page.title()
                      print(f'✔ {name}: {title[:70]}')
                  except Exception as e:
                      print(f'✘ {name}: {e}')
                      try:
                          page.screenshot(path=f'out/{name}_error.png', full_page=False)
                      except: pass
              browser.close()
          PYEOF
          python3 shot.py
          ls -la out/

      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: iwara-shots
          path: out/
          retention-days: 7
