name: 分卷推送v3 (jsDelivr 加速, 防缓存+历史重置)

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'artifact ID'
        required: true
        type: string

env:
  ART_ID: ${{ github.event.inputs.artifact_id }}

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 下载 artifact
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          mkdir -p work
          curl -sL -H "Authorization: token $GH_TOKEN" \
            -o work/bt.zip \
            "https://api.github.com/repos/sgswzglwlx/sandbox-ehentai-downloader/actions/artifacts/$ART_ID/zip"
          echo "size: $(stat -c%s work/bt.zip)"

      - name: 拆分分卷(带时间戳前缀)
        run: |
          mkdir -p parts
          TS=$(date +%s)
          cd parts
          split -b 18m ../work/bt.zip "${TS}-"
          echo "分卷数: $(ls | wc -l)"

      - name: 分批推送分卷到 chunk-host
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/sgswzglwlx/chunk-host.git /tmp/ch
          cd /tmp/ch
          git config user.name "chunk-bot"
          git config user.email "chunk-bot@users.noreply.github.com"
          rm -rf chunks
          mkdir -p chunks
          
          # 分批复制 + push（每批 30 个分卷）
          cd $GITHUB_WORKSPACE/parts
          TOTAL=$(ls | wc -l)
          i=0
          for f in *; do
            cp "$f" /tmp/ch/chunks/
            i=$((i+1))
            if [ $((i % 30)) -eq 0 ] || [ "$i" -eq "$TOTAL" ]; then
              echo "推送批次 $i/$TOTAL ..."
              cd /tmp/ch
              git add -A
              git -c user.name="chunk-bot" -c user.email="chunk-bot@users.noreply.github.com" commit -m "chunks batch $i $(date +%s)" 2>/dev/null || echo "无变更"
              git push origin main
              cd $GITHUB_WORKSPACE/parts
            fi
          done
          echo "✅ 分批推送完成"
