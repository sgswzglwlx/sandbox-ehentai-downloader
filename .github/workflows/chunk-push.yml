name: 分卷推送v3 (jsDelivr 加速, 防缓存+历史重置)

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'artifact ID'
        required: true
        type: string

env:
  ART_ID: ${{ github.event.inputs.artifact_id }}

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 下载 artifact
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          mkdir -p work
          curl -sL -H "Authorization: token $GH_TOKEN" \
            -o work/bt.zip \
            "https://api.github.com/repos/sgswzglwlx/sandbox-ehentai-downloader/actions/artifacts/$ART_ID/zip"
          echo "size: $(stat -c%s work/bt.zip)"

      - name: 拆分分卷(带时间戳前缀)
        run: |
          mkdir -p parts
          TS=$(date +%s)
          cd parts
          split -b 18m ../work/bt.zip "${TS}-"
          echo "分卷数: $(ls | wc -l)"

      - name: 推送分卷到 chunk-host (重置历史)
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/sgswzglwlx/chunk-host.git /tmp/ch
          cd /tmp/ch
          git config user.name "chunk-bot"
          git config user.email "chunk-bot@users.noreply.github.com"
          # 重置历史：只保留一个孤儿提交
          git checkout --orphan tmp-branch 2>/dev/null || true
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf chunks
          mkdir -p chunks
          cp $GITHUB_WORKSPACE/parts/* chunks/
          ls chunks/ | head -3
          echo "分卷数: $(ls chunks | wc -l)"
          git add -A
          git -c user.name="chunk-bot" -c user.email="chunk-bot@users.noreply.github.com" commit -m "chunks $(date +%s)" || echo "无变更"
          git branch -M main
          git push -f origin main
          echo "✅ push 完成（历史已重置）"
