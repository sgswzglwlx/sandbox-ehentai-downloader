name: 分卷推送v2 (jsDelivr 加速, 防缓存)

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'artifact ID'
        required: true
        type: string

env:
  ART_ID: ${{ github.event.inputs.artifact_id }}

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 下载 artifact
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          mkdir -p work
          curl -sL -H "Authorization: token $GH_TOKEN" \
            -o work/bt.zip \
            "https://api.github.com/repos/sgswzglwlx/sandbox-ehentai-downloader/actions/artifacts/$ART_ID/zip"
          echo "size: $(stat -c%s work/bt.zip)"

      - name: 拆分分卷(带时间戳前缀)
        run: |
          mkdir -p parts
          TS=$(date +%s)
          cd parts
          split -b 18m ../work/bt.zip "${TS}-"
          ls -la | head -60
          echo "分卷数: $(ls | wc -l)"
          ls > ../chunk-list.txt

      - name: 推送分卷到 chunk-host
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/sgswzglwlx/chunk-host.git /tmp/ch
          cd /tmp/ch
          git config user.name "chunk-bot"
          git config user.email "chunk-bot@users.noreply.github.com"
          rm -rf chunks
          mkdir -p chunks
          cp $GITHUB_WORKSPACE/parts/* chunks/
          cp $GITHUB_WORKSPACE/chunk-list.txt chunks/INDEX.txt
          echo "分卷数: $(ls chunks | wc -l)"
          git add -A
          git commit -m "chunks $(date +%s)" || echo "无变更"
          git push origin main || git push -u origin main
          echo "✅ push 完成"
