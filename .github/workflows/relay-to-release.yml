name: artifact转Release

on:
  workflow_dispatch:
    inputs:
      artifact_ids:
        description: 'artifact ID 列表（逗号分隔）'
        required: true
        type: string

env:
  INPUT_IDS: ${{ github.event.inputs.artifact_ids }}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 下载并上传 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          mkdir -p work
          python3 - << 'PYEOF'
          import os, json, subprocess, urllib.request, urllib.error

          repo = os.environ['GITHUB_REPO']
          tok = os.environ['GH_TOKEN']
          ids = [x.strip() for x in os.environ['INPUT_IDS'].split(',') if x.strip()]

          for aid in ids:
              try:
                  # 获取 artifact 名称
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}',
                      headers={'Authorization': f'token {tok}',
                               'Accept': 'application/vnd.github.v3+json'})
                  info = json.loads(urllib.request.urlopen(req, timeout=30).read())
                  name = info['name']
                  size = info['size_in_bytes']
                  print(f'处理 {name} ({size/1048576:.0f}MB) ...', flush=True)

                  # 用 curl 下载 zip（正确处理二进制 + 跟随重定向）
                  r = subprocess.run(
                      ['curl', '-sL', '-H', f'Authorization: token {tok}',
                       '-o', f'work/{name}.zip',
                       f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip'],
                      capture_output=True, text=True, timeout=300)
                  if os.path.exists(f'work/{name}.zip') and os.path.getsize(f'work/{name}.zip') > 100000:
                      sz = os.path.getsize(f'work/{name}.zip')
                      print(f'  下载完成 {sz/1048576:.0f}MB, 上传 Release...', flush=True)
                      r2 = subprocess.run(
                          ['gh', 'release', 'upload', 'r34-videos', f'work/{name}.zip',
                           '--repo', repo, '--clobber'],
                          capture_output=True, text=True, timeout=900)
                      if r2.returncode == 0:
                          print(f'  ✔ {name} -> Release', flush=True)
                      else:
                          print(f'  ✘ 上传失败: {r2.stderr[-300:]}', flush=True)
                  else:
                      print(f'  ✘ 下载失败 size={os.path.getsize(f"work/{name}.zip") if os.path.exists(f"work/{name}.zip") else 0}', flush=True)
              except Exception as e:
                  print(f'  ✘ {aid} 错误: {e}', flush=True)
          PYEOF
