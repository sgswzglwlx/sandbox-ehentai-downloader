name: yt-dlp 单视频下载

on:
  workflow_dispatch:
    inputs:
      name:
        description: '视频名称'
        required: true
        type: string
      quality:
        description: '清晰度 best/480/720 (默认best)'
        required: false
        type: string
        default: 'best'
      url:
        description: '视频URL'
        required: true
        type: string

env:
  INPUT_NAME: ${{ github.event.inputs.name }}
  INPUT_URL: ${{ github.event.inputs.url }}

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 yt-dlp
        run: pip install -q -U "yt-dlp[default,curl-cffi]"

      - name: 下载视频
        run: |
          mkdir -p out
          QUALITY="${{ github.event.inputs.quality }}"
          if [ "$QUALITY" = "480" ]; then
            yt-dlp --impersonate chrome -S "res:480" -o "out/${INPUT_NAME}.%(ext)s" --no-part "${INPUT_URL}" || yt-dlp --impersonate chrome -f 'best' -o "out/${INPUT_NAME}.%(ext)s" --no-part "${INPUT_URL}"
          elif [ "$QUALITY" = "720" ]; then
            yt-dlp -S "res:720" -o "out/${INPUT_NAME}.%(ext)s" --no-part "${INPUT_URL}" || yt-dlp --impersonate chrome -f 'best' -o "out/${INPUT_NAME}.%(ext)s" --no-part "${INPUT_URL}"
          else
            yt-dlp --impersonate chrome -f 'best' -o "out/${INPUT_NAME}.%(ext)s" --no-part "${INPUT_URL}" || yt-dlp --impersonate chrome -f 'bestvideo+bestaudio' --merge-output-format mp4 -o "out/${INPUT_NAME}.%(ext)s" --no-part "${INPUT_URL}"
          fi
          echo "---" 
          ls -la out/

      - name: 上传视频
        uses: actions/upload-artifact@v4
        with:
          name: video_${{ github.event.inputs.name }}
          path: out/
          retention-days: 7

