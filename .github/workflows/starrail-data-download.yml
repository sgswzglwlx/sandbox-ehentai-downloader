name: StarRailData下载

on:
  workflow_dispatch:
    inputs:
      url:
        description: '下载URL(默认codeload tarball)'
        required: false
        type: string
        default: 'https://codeload.github.com/iam-akuzihs/StarRailData/tar.gz/refs/heads/master'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 下载
        run: |
          URL="${{ github.event.inputs.url }}"
          echo "下载: $URL"
          curl -sL --retry 5 --retry-delay 3 -o starrail-data.tar.gz "$URL"
          ls -lh starrail-data.tar.gz
          file starrail-data.tar.gz

      - name: 上传Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="starrail-data-$(date +%s)"
          echo "TAG=$TAG"
          gh release create "$TAG" starrail-data.tar.gz \
            --repo "${{ github.repository }}" \
            --title "StarRailData" \
            --notes "auto download $(date -u)"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
