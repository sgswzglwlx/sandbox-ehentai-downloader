name: 多平台搜索

on:
  workflow_dispatch:
    inputs:
      query:
        description: '搜索关键词'
        required: true
        type: string
      site:
        description: '站点 eporner/xvideos/hqporner'
        required: false
        type: string
        default: 'eporner'
      max_results:
        description: '最大结果数'
        required: false
        type: string
        default: '10'

env:
  INPUT_QUERY: ${{ github.event.inputs.query }}
  INPUT_SITE: ${{ github.event.inputs.site }}
  INPUT_MAX: ${{ github.event.inputs.max_results }}

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: pip install -q -U "yt-dlp[default,curl-cffi]" requests beautifulsoup4

      - name: 多平台搜索
        run: |
          mkdir -p out
          python3 << 'PYEOF'
          import os, json, subprocess, re, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          query = os.environ['INPUT_QUERY']
          site = os.environ['INPUT_SITE']
          max_results = int(os.environ.get('INPUT_MAX', '10'))
          q = urllib.parse.quote(query)

          results = []
          headers = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36'}

          if site == 'eporner':
              url = f'https://www.eporner.com/search/{q}/'
              try:
                  r = requests.get(url, headers=headers, timeout=30)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.select('a[href*="/hd-porn/"]')[:max_results]:
                      href = a['href']
                      vid_id = href.split('/')[-2] if href.endswith('/') else href.split('/')[-1]
                      title = a.get('title') or a.text.strip()
                      results.append({'id': vid_id, 'title': title[:80], 'url': f'https://www.eporner.com{href}'})
                  # 时长在卡片里
                  durs = soup.select('.mbtime')
                  for i, d in enumerate(durs[:len(results)]):
                      results[i]['duration_str'] = d.text.strip()
                  print(f'eporner 找到 {len(results)} 个')
              except Exception as e:
                  print(f'eporner 失败: {e}')

          elif site == 'xvideos':
              url = f'https://www.xvideos.com/?k={q}'
              try:
                  r = requests.get(url, headers=headers, timeout=30)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.select('a[href*="/video"]')[:max_results]:
                      href = a['href']
                      if not href.startswith('http'):
                          href = 'https://www.xvideos.com' + href
                      title = a.get('title') or a.text.strip()
                      results.append({'id': href.split('/')[-1].split('_')[0], 'title': title[:80], 'url': href})
                  print(f'xvideos 找到 {len(results)} 个')
              except Exception as e:
                  print(f'xvideos 失败: {e}')

          elif site == 'hqporner':
              url = f'https://hqporner.com/?q={q}'
              try:
                  r = requests.get(url, headers=headers, timeout=30)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.select('a[href*="/vid/"]')[:max_results]:
                      href = a['href']
                      if not href.startswith('http'):
                          href = 'https://hqporner.com' + href
                      title = a.get('title') or a.text.strip()
                      results.append({'id': href.split('/')[-2], 'title': title[:80], 'url': href})
                  print(f'hqporner 找到 {len(results)} 个')
              except Exception as e:
                  print(f'hqporner 失败: {e}')

          print(f'共 {len(results)} 个视频:')
          for r in results:
              dur = r.get('duration_str', '?')
              print(f"  {r['title'][:50]} | {dur} | {r['url'][:70]}")

          with open('out/search_results.json', 'w') as f:
              json.dump(results, f, ensure_ascii=False, indent=2)
          PYEOF

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: out/
          retention-days: 7
