name: 自动监控-幼驯染THE ANIMATION第3卷

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检查是否已有有效产物
        id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '[.artifacts[]|select(.name|startswith("MUJIKAKU3"))|select(.size_in_bytes > 104857600)]|length' 2>/dev/null || echo 0)
          echo "已有有效产物数: $N"
          if [ "$N" -gt 0 ]; then echo "skip=true" >> $GITHUB_OUTPUT; else echo "skip=false" >> $GITHUB_OUTPUT; fi

      - name: 检出
        if: steps.dup.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: 安装依赖
        if: steps.dup.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q aria2
          pip install -q requests

      - name: 搜索并下载
        id: search
        if: steps.dup.outputs.skip == 'false'
        run: |
          python3 - <<'PY'
          import requests, re, subprocess, sys, os, json
          H={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36"}
          FEEDS=["https://sukebei.nyaa.si/?page=rss&q=Mujikaku+na+Osananajimi",
                 "https://sukebei.nyaa.si/?page=rss&q=%E7%84%A1%E8%87%AA%E8%A6%9A%E3%81%AA%E5%B9%BC%E9%A6%B4%E6%9F%93",
                 "https://sukebei.nyaa.si/?page=rss&q=%E3%83%A4%E3%81%A3%E3%81%A6%E3%81%BF%E3%81%9F%E3%82%89+THE+ANIMATION"]
          hits={}
          for u in FEEDS:
              try:
                  r=requests.get(u,headers=H,timeout=45)
              except Exception as e:
                  print("feed err",u,e); continue
              for it in re.findall(r'<item>(.*?)</item>', r.text, flags=re.S):
                  t=re.search(r'<title>(.*?)</title>',it,flags=re.S)
                  l=re.search(r'<link>(.*?)</link>',it,flags=re.S)
                  if not t or not l: continue
                  title=re.sub(r'<[^>]+>','',t.group(1)).strip()
                  link=l.group(1).strip()
                  hit = False
                  if '128088053' in title:
                      hit = True
                  else:
                      is_anime = bool(re.search(r'(?i)the\s*animation', title)) or bool(re.search(r'ヤってみたら\s*#', title))
                      is_ours = ('ヤってみたら' in title) or ('Osananajimi' in title) or ('無自覚な幼馴染' in title)
                      not_12 = not re.search(r'(第\s*[12]\s*巻|#\s*[12](?![0-9])|01-02|第[一二]巻)', title)
                      if is_anime and is_ours and not_12:
                          hit = True
                  if hit:
                      hits[link]=title
          print("命中数:", len(hits))
          for k,v in hits.items():
              print("  *", v[:120]); print("   ", k)
          if not hits:
              print("FOUND=0")
              sys.exit(0)
          print("FOUND=1")
          open('/tmp/found','w').write('1')
          os.makedirs('out', exist_ok=True)
          trackers="udp://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce,udp://tracker.openbittorrent.com:6969/announce"
          ok=False
          for i,(link,title) in enumerate(list(hits.items())[:3]):
              tf=f'/tmp/t{i}.torrent'
              try:
                  rr=requests.get(link,headers=H,timeout=60)
                  open(tf,'wb').write(rr.content)
                  print("torrent bytes:", len(rr.content))
              except Exception as e:
                  print("torrent err", e); continue
              os.makedirs(f'out/v{i}', exist_ok=True)
              cmd=["aria2c",f"--dir=out/v{i}","--enable-dht=true","--dht-listen-port=6881-6999",
                   "--dht-entry-point=router.bittorrent.com:6881",
                   "--enable-peer-exchange=true","--bt-max-peers=0","--bt-request-peer-speed-limit=20M",
                   "--file-allocation=none","--seed-time=0",f"--bt-tracker={trackers}",
                   "--console-log-level=warn","--summary-interval=60","--max-connection-per-server=16", tf]
              print("开始下载:", title[:100])
              p=subprocess.run(cmd, timeout=9000)
              print("aria2 exit:", p.returncode)
              for root,_,files in os.walk(f'out/v{i}'):
                  for f in files:
                      fp=os.path.join(root,f)
                      print("  文件:", fp, os.path.getsize(fp))
                      if os.path.getsize(fp) > 50*1024*1024: ok=True
          open('out/RESULT.txt','w').write('DONE' if ok else 'EMPTY')
          print("RESULT:", 'DONE' if ok else 'EMPTY')
          PY
          if [ -f /tmp/found ]; then echo "found=true" >> $GITHUB_OUTPUT; else echo "found=false" >> $GITHUB_OUTPUT; fi

      - name: 上传产物
        if: steps.dup.outputs.skip == 'false' && steps.search.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MUJIKAKU3-${{ github.run_id }}
          path: out
          retention-days: 14
          if-no-files-found: ignore

      - name: 汇总
        if: always()
        run: |
          {
            echo "## 监控结果 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- 去重跳过: ${{ steps.dup.outputs.skip }}"
            echo "- 命中: ${{ steps.search.outputs.found }}"
          } >> $GITHUB_STEP_SUMMARY
