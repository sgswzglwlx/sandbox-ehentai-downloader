name: 分卷推送v4 (chunk-host2 分段)
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'artifact ID'
        required: true
        type: string
      chunk_start:
        description: '起始分卷索引(0起, 默认0)'
        required: false
        type: string
        default: '0'
      chunk_count:
        description: '本批分卷数(默认90)'
        required: false
        type: string
        default: '90'

env:
  ART_ID: ${{ github.event.inputs.artifact_id }}
  C_START: ${{ github.event.inputs.chunk_start }}
  C_COUNT: ${{ github.event.inputs.chunk_count }}

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 下载 artifact
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          mkdir -p work
          curl -sL -H "Authorization: token $GH_TOKEN" -o work/src.zip "https://api.github.com/repos/sgswzglwlx/sandbox-ehentai-downloader/actions/artifacts/$ART_ID/zip"
          echo "size: $(stat -c%s work/src.zip)"

      - name: 拆卷并选取本批
        run: |
          mkdir -p allparts selected
          cd allparts
          TS=$(date +%s)
          split -b 18m ../work/src.zip "${TS}-"
          TOTAL=$(ls | wc -l)
          echo "总卷数: $TOTAL | 本批: start=$C_START count=$C_COUNT"
          ls | sort | tail -n +$((C_START+1)) | head -n $C_COUNT > /tmp/sel.txt
          while read f; do mv "$f" ../selected/; done < /tmp/sel.txt
          cd ../selected
          echo "本批卷数: $(ls | wc -l)"
          echo "TS=${TS}" >> $GITHUB_ENV
          echo "SELECTED=$(ls | wc -l)" >> $GITHUB_ENV

      - name: 推送到 chunk-host2 (强制重置历史)
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          cd $GITHUB_WORKSPACE/selected
          git init -q
          git config user.name "chunk-bot"
          git config user.email "chunk-bot@users.noreply.github.com"
          mkdir -p chunks
          mv * chunks/ 2>/dev/null || true
          echo "# chunk-host2 批次 ${TS}" > README.md
          git add -A
          git commit -q -m "batch ${TS} start=${C_START} count=${SELECTED}"
          git branch -M main
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/sgswzglwlx/chunk-host2.git
          git push -f origin main
          echo "✅ 完成: TS=${TS} 卷数=${SELECTED} start=${C_START}"
          echo "TS=${TS}" > /tmp/ts.txt
