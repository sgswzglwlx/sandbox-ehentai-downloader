name: iwara 搜索下载

on:
  workflow_dispatch:
    inputs:
      query:
        description: '搜索关键词（角色名）'
        required: true
        type: string
      max_results:
        description: '最大结果数'
        required: false
        type: string
        default: '10'

env:
  INPUT_QUERY: ${{ github.event.inputs.query }}
  INPUT_MAX: ${{ github.event.inputs.max_results }}

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装依赖（含 impersonation 支持）
        run: pip install -q -U "yt-dlp[default,curl-cffi]" playwright && (npx playwright install chromium --with-deps 2>/dev/null || python3 -m playwright install chromium --with-deps 2>/dev/null || true)

      - name: Playwright 渲染 iwara 搜索页
        run: |
          mkdir -p out
          cat > search.py << 'PYEOF'
          import os, json, re, subprocess
          from playwright.sync_api import sync_playwright

          query = os.environ['INPUT_QUERY']
          max_results = int(os.environ.get('INPUT_MAX', '10'))
          results = []

          # 方法1: yt-dlp 直接搜索（curl-cffi impersonation）
          try:
              r = subprocess.run(
                  ['yt-dlp', '--flat-playlist', '-J', '--playlist-end', str(max_results),
                   f'https://www.iwara.tv/videos?query={query}'],
                  capture_output=True, text=True, timeout=90)
              if r.returncode == 0 and r.stdout.strip():
                  data = json.loads(r.stdout)
                  for e in data.get('entries', []):
                      if not e: continue
                      vid = e.get('id','')
                      results.append({
                          'id': vid, 'title': e.get('title', f'iwara_{vid}')[:60],
                          'url': f'https://www.iwara.tv/video/{vid}', 'duration': e.get('duration')
                      })
                  print(f'[yt-dlp+impersonation] 找到 {len(results)} 个')
          except Exception as e:
              print(f'[yt-dlp] 失败: {e}')

          # 方法2: Playwright 渲染兜底
          if not results:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True, args=['--no-sandbox'])
                  page = browser.new_page(user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36')
                  try:
                      page.goto(f'https://www.iwara.tv/videos?query={query}', timeout=45000, wait_until='networkidle')
                      page.wait_for_timeout(3000)
                      links = page.eval_on_selector_all('a[href*="/video/"]', 'els => els.map(e => e.href)')
                      seen = set()
                      for l in links:
                          m = re.search(r'/video/([a-zA-Z0-9]+)', l)
                          if m and m.group(1) not in seen:
                              seen.add(m.group(1))
                              results.append({'id': m.group(1), 'title': f'iwara_{m.group(1)}', 'url': f'https://www.iwara.tv/video/{m.group(1)}', 'duration': None})
                      print(f'[Playwright] 找到 {len(results)} 个')
                  except Exception as e:
                      print(f'[Playwright] 失败: {e}')
                  browser.close()

          print(f'共 {len(results)} 个视频:')
          for r in results[:max_results]:
              print(f"  {r['id']} | {r['title'][:50]} | {r['url']}")

          with open('out/iwara_results.json', 'w') as f:
              json.dump(results[:max_results], f, ensure_ascii=False, indent=2)
          PYEOF
          python3 search.py

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: iwara-results
          path: out/
          retention-days: 7
