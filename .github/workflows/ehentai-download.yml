name: E-Hentai 漫画下载

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '模式'
        required: true
        default: 'download'
        type: choice
        options:
          - download
          - search
      gallery_urls:
        description: '画廊URL（download模式，多个用逗号分隔）'
        required: false
        type: string
      search_keyword:
        description: '搜索关键词（search模式）'
        required: false
        type: string
      search_page:
        description: '搜索页码（search模式，默认1）'
        required: false
        default: '1'
        type: string
      cookies:
        description: 'Cookie字符串（可选，格式: ipb_member_id=xxx; ipb_pass_hash=xxx; igneous=xxx），用于ExHentai/原图'
        required: false
        type: string
      output_format:
        description: '输出格式'
        required: true
        default: 'zip'
        type: choice
        options:
          - zip
          - images

env:
  DL_DIR: ${{ github.workspace }}/downloads

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -q gallery-dl requests beautifulsoup4
          gallery-dl --version

      - name: 生成 cookies.txt
        if: ${{ github.event.inputs.cookies != '' }}
        run: |
          python3 << 'PYEOF'
          import os
          cookie_str = os.environ.get('COOKIE_STR', '')
          pairs = [p.strip() for p in cookie_str.split(';') if '=' in p]
          lines = ["# Netscape HTTP Cookie File"]
          for p in pairs:
              name, _, value = p.partition('=')
              lines.append(f".e-hentai.org\tTRUE\t/\tTRUE\t0\t{name.strip()}\t{value.strip()}")
              lines.append(f".exhentai.org\tTRUE\t/\tTRUE\t0\t{name.strip()}\t{value.strip()}")
          with open('cookies.txt', 'w') as f:
              f.write("\n".join(lines))
          print(f"cookies.txt 已生成: {len(pairs)} 个cookie")
          PYEOF
        env:
          COOKIE_STR: ${{ github.event.inputs.cookies }}

      - name: 搜索画廊
        if: ${{ github.event.inputs.mode == 'search' }}
        env:
          KEYWORD: ${{ github.event.inputs.search_keyword }}
          PAGE: ${{ github.event.inputs.search_page }}
          COOKIE_STR: ${{ github.event.inputs.cookies }}
        run: |
          python3 << 'PYEOF'
          import requests, os
          from bs4 import BeautifulSoup

          keyword = os.environ.get('KEYWORD', '')
          page = os.environ.get('PAGE', '1')
          cookie_str = os.environ.get('COOKIE_STR', '')

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          }
          cj = {}
          if cookie_str:
              for p in cookie_str.split(';'):
                  if '=' in p:
                      k, _, v = p.partition('=')
                      cj[k.strip()] = v.strip()

          url = f'https://e-hentai.org/?f_search={keyword}&page={page}'
          resp = requests.get(url, headers=headers, cookies=cj, timeout=30)
          print(f'HTTP {resp.status_code}, 页面大小: {len(resp.text)}')
          # 保存 HTML 供调试
          with open('debug_page.html', 'w', encoding='utf-8') as f:
              f.write(resp.text)
          # 打印前 3000 字符
          print('=== HTML 前 3000 字符 ===')
          print(resp.text[:3000])
          print('=== HTML 尾部 2000 字符 ===')
          print(resp.text[-2000:])
          soup = BeautifulSoup(resp.text, 'html.parser')

          results = []
          for glink in soup.select('.glink'):
              title = glink.get_text(strip=True)
              if not title:
                  continue
              a = glink.find_parent('a')
              href = a['href'] if a and a.has_attr('href') else ''
              # 向上找 tr 获取更多信息
              tr = glink.find_parent('tr')
              info = tr.get_text(' ', strip=True)[:180] if tr else ''
              results.append((title, href, info))

          out = [f'搜索: {keyword} (第{page}页) | 找到 {len(results)} 个画廊', '=' * 90]
          for i, (title, href, info) in enumerate(results, 1):
              out.append(f'[{i}] {title}')
              out.append(f'    URL: {href}')
              out.append(f'    信息: {info}')
              out.append('')
          report = '\n'.join(out)
          print(report)
          with open('search_report.txt', 'w', encoding='utf-8') as f:
              f.write(report)
          with open('search_urls.txt', 'w', encoding='utf-8') as f:
              for _, href, _ in results:
                  if href:
                      f.write(href + '\n')
          PYEOF

      - name: 下载漫画
        if: ${{ github.event.inputs.mode == 'download' }}
        env:
          URLS: ${{ github.event.inputs.gallery_urls }}
          COOKIE_STR: ${{ github.event.inputs.cookies }}
          DL_DIR: ${{ env.DL_DIR }}
        run: |
          python3 << 'PYEOF'
          import requests, re, os, time, sys
          from bs4 import BeautifulSoup

          urls = [u.strip() for u in os.environ.get('URLS', '').split(',') if u.strip()]
          cookie_str = os.environ.get('COOKIE_STR', '')
          dl_dir = os.environ.get('DL_DIR', './downloads')

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9',
          }
          cj = {}
          if cookie_str:
              for p in cookie_str.split(';'):
                  if '=' in p:
                      k, _, v = p.partition('=')
                      cj[k.strip()] = v.strip()
          s = requests.Session()
          s.headers.update(headers)
          s.cookies.update(cj)

          def safe_name(name):
              return re.sub(r'[\\/:*?"<>|\n\r\t]', '_', name).strip()[:150]

          for gallery_url in urls:
              print(f'=== 处理画廊: {gallery_url} ===')
              # 1. 获取画廊页
              resp = s.get(gallery_url, timeout=30)
              print(f'画廊页 HTTP {resp.status_code}, {len(resp.text)} bytes')
              soup = BeautifulSoup(resp.text, 'html.parser')

              # 提取标题
              title_el = soup.select_one('#gn') or soup.select_one('h1')
              title = safe_name(title_el.get_text(strip=True)) if title_el else f'gallery_{int(time.time())}'
              print(f'标题: {title}')

              # 2. 提取每页详情页链接（处理列表分页，每页20个）
              page_links = []
              def collect_links(bs):
                  found = []
                  # 方式1: #gdt 容器里的 .gdtm a
                  for a in bs.select('#gdt .gdtm a, #gdt a'):
                      href = a.get('href', '')
                      if '/s/' in href and href not in found:
                          found.append(href)
                  # 方式2: 如果没有 #gdt，找所有 /s/ 链接
                  if not found:
                      for a in bs.select('a[href*="/s/"]'):
                          href = a.get('href', '')
                          if href not in found:
                              found.append(href)
                  return found

              page_links = collect_links(soup)
              print(f'第0页找到 {len(page_links)} 个链接')

              # 判断总列表页数（每页20图）
              total_list_pages = 1
              # 方式1: 从 .ptt 分页导航里找最大页码
              import urllib.parse as up
              for a in soup.select('.ptt a[href*="p="]'):
                  qs = up.parse_qs(up.urlparse(a['href']).query)
                  for v in qs.get('p', []):
                      try:
                          p = int(v)
                          if p + 1 > total_list_pages:
                              total_list_pages = p + 1
                      except ValueError:
                          pass
              if total_list_pages > 1:
                  print(f'从 .ptt 导航推断列表页数: {total_list_pages}')
              # 方式2: 从 gdt2 里的 "N pages" 文本
              if total_list_pages == 1:
                  gdt2 = soup.select_one('.gdt2')
                  if gdt2:
                      import re as _re
                      m = _re.search(r'(\d+)\s+pages?', gdt2.get_text())
                      if m:
                          total_images = int(m.group(1))
                          total_list_pages = (total_images + 19) // 20
                          print(f'从 gdt2 解析: {total_images} 张图, {total_list_pages} 个列表页')

              # 抓取后续列表页
              for p in range(1, total_list_pages):
                  page_url = gallery_url + ('' if '?' in gallery_url else '?') + f'p={p}'
                  try:
                      presp = s.get(page_url, timeout=30)
                      psoup = BeautifulSoup(presp.text, 'html.parser')
                      links = collect_links(psoup)
                      page_links.extend(links)
                      print(f'第{p}页找到 {len(links)} 个链接 (累计 {len(page_links)})')
                  except Exception as e:
                      print(f'第{p}页抓取失败: {e}')
                  time.sleep(0.5)

              # 去重保序
              seen = set()
              page_links = [x for x in page_links if not (x in seen or seen.add(x))]
              print(f'总共找到 {len(page_links)} 个页面链接')

              # 3. 获取图片总数（原图页）
              img_urls = []
              for i, link in enumerate(page_links):
                  try:
                      presp = s.get(link, timeout=30)
                      psoup = BeautifulSoup(presp.text, 'html.parser')
                      # 原图URL在 #img 的 src 属性
                      img = psoup.select_one('#img')
                      if img and img.has_attr('src'):
                          img_urls.append(img['src'])
                      else:
                          # 备选: .sn-img img
                          img2 = psoup.select_one('img')
                          if img2 and img2.has_attr('src'):
                              img_urls.append(img2['src'])
                          else:
                              print(f'  第{i+1}页: 未找到图片URL')
                      if (i+1) % 10 == 0:
                          print(f'  已解析 {i+1}/{len(page_links)} 页')
                  except Exception as e:
                      print(f'  第{i+1}页解析失败: {e}')
                  time.sleep(0.3)

              print(f'共获取 {len(img_urls)} 张图片URL')
              if not img_urls:
                  print('!! 未获取到任何图片URL，跳过')
                  continue

              # 4. 下载所有图片
              save_dir = os.path.join(dl_dir, title)
              os.makedirs(save_dir, exist_ok=True)
              for i, url in enumerate(img_urls, 1):
                  try:
                      img_headers = dict(headers)
                      img_headers['Referer'] = gallery_url
                      r = s.get(url, headers=img_headers, timeout=30)
                      if r.status_code == 200:
                          ext = os.path.splitext(url.split('?')[0])[1] or '.jpg'
                          fname = f'{i:04d}{ext}'
                          with open(os.path.join(save_dir, fname), 'wb') as f:
                              f.write(r.content)
                          if i % 10 == 0 or i == len(img_urls):
                              print(f'  [{i}/{len(img_urls)}] 已保存 {fname} ({len(r.content)//1024}KB)')
                      else:
                          print(f'  [{i}/{len(img_urls)}] HTTP {r.status_code} 下载失败')
                      time.sleep(0.2)
                  except Exception as e:
                      print(f'  [{i}/{len(img_urls)}] 下载异常: {e}')
              print(f'✔ 画廊下载完成: {title} -> {save_dir}')

          print('ALL_DONE')
          PYEOF
          echo "=== 下载完成，文件列表 ==="
          find "$DL_DIR" -type f | head -50

      - name: 打包 ZIP
        if: ${{ github.event.inputs.mode == 'download' && github.event.inputs.output_format == 'zip' }}
        run: |
          cd "$DL_DIR"
          found=0
          for d in */; do
            [ -d "$d" ] || continue
            found=1
            name=$(basename "$d" | sed 's/[/ :*?"<>|]/_/g')
            echo "打包目录: $name"
            cd "$d"
            zip -r -0 "$DL_DIR/../${name}.zip" . 2>&1 | tail -2
            cd "$DL_DIR"
          done
          if [ $found -eq 0 ]; then
            echo "未找到下载目录，检查原始结构"
            find "$DL_DIR" -type f | head -20
          fi
          cd "$DL_DIR/.."
          ls -lh *.zip 2>/dev/null || echo "未生成zip"

      - name: 分卷压缩（大文件拆分为10MB分卷）
        if: ${{ github.event.inputs.mode == 'download' && github.event.inputs.output_format == 'zip' }}
        run: |
          cd "$DL_DIR/.."
          for z in *.zip; do
            [ -f "$z" ] || continue
            size=$(stat -c%s "$z")
            echo "ZIP: $z ($((size/1024/1024))MB)"
            if [ $size -gt 10485760 ]; then
              # 超过10MB就分卷
              split -b 10M -d -a 3 "$z" "${z}.part"
              rm -f "$z"
              echo "已分卷: ${z}.part*"
              ls -lh "${z}".part* | head -10
            fi
          done
          echo "=== 分卷后文件 ==="
          ls -lh "$DL_DIR/.."/*.part* 2>/dev/null || echo "无需分卷"

      - name: 上传下载文件
        uses: actions/upload-artifact@v4
        with:
          name: ehentai-downloads
          path: |
            downloads/
            *.zip
            *.part*
            search_report.txt
            search_urls.txt
          compression-level: 0
          retention-days: 7
