name: E-Hentai 漫画下载

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '模式'
        required: true
        default: 'download'
        type: choice
        options:
          - download
          - search
      gallery_urls:
        description: '画廊URL（download模式，多个用逗号分隔）'
        required: false
        type: string
      search_keyword:
        description: '搜索关键词（search模式）'
        required: false
        type: string
      search_page:
        description: '搜索页码（search模式，默认1）'
        required: false
        default: '1'
        type: string
      cookies:
        description: 'Cookie字符串（可选，格式: ipb_member_id=xxx; ipb_pass_hash=xxx; igneous=xxx），用于ExHentai/原图'
        required: false
        type: string
      output_format:
        description: '输出格式'
        required: true
        default: 'zip'
        type: choice
        options:
          - zip
          - images

env:
  DL_DIR: ${{ github.workspace }}/downloads

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -q gallery-dl requests beautifulsoup4
          gallery-dl --version

      - name: 生成 cookies.txt
        if: ${{ github.event.inputs.cookies != '' }}
        run: |
          python3 << 'PYEOF'
          import os
          cookie_str = os.environ.get('COOKIE_STR', '')
          pairs = [p.strip() for p in cookie_str.split(';') if '=' in p]
          lines = ["# Netscape HTTP Cookie File"]
          for p in pairs:
              name, _, value = p.partition('=')
              lines.append(f".e-hentai.org\tTRUE\t/\tTRUE\t0\t{name.strip()}\t{value.strip()}")
              lines.append(f".exhentai.org\tTRUE\t/\tTRUE\t0\t{name.strip()}\t{value.strip()}")
          with open('cookies.txt', 'w') as f:
              f.write("\n".join(lines))
          print(f"cookies.txt 已生成: {len(pairs)} 个cookie")
          PYEOF
        env:
          COOKIE_STR: ${{ github.event.inputs.cookies }}

      - name: 搜索画廊
        if: ${{ github.event.inputs.mode == 'search' }}
        env:
          KEYWORD: ${{ github.event.inputs.search_keyword }}
          PAGE: ${{ github.event.inputs.search_page }}
          COOKIE_STR: ${{ github.event.inputs.cookies }}
        run: |
          python3 << 'PYEOF'
          import requests, os
          from bs4 import BeautifulSoup

          keyword = os.environ.get('KEYWORD', '')
          page = os.environ.get('PAGE', '1')
          cookie_str = os.environ.get('COOKIE_STR', '')

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          }
          cj = {}
          if cookie_str:
              for p in cookie_str.split(';'):
                  if '=' in p:
                      k, _, v = p.partition('=')
                      cj[k.strip()] = v.strip()

          url = f'https://e-hentai.org/?f_search={keyword}&page={page}'
          resp = requests.get(url, headers=headers, cookies=cj, timeout=30)
          print(f'HTTP {resp.status_code}, 页面大小: {len(resp.text)}')
          soup = BeautifulSoup(resp.text, 'html.parser')

          results = []
          for tr in soup.select('table.itg.gllist tr'):
              name_el = tr.select_one('.glink')
              if not name_el:
                  continue
              title = name_el.get_text(strip=True)
              a = tr.select_one('a')
              href = a['href'] if a and a.has_attr('href') else ''
              info = tr.get_text(' ', strip=True)[:180]
              results.append((title, href, info))

          out = [f'搜索: {keyword} (第{page}页) | 找到 {len(results)} 个画廊', '=' * 90]
          for i, (title, href, info) in enumerate(results, 1):
              out.append(f'[{i}] {title}')
              out.append(f'    URL: {href}')
              out.append(f'    信息: {info}')
              out.append('')
          report = '\n'.join(out)
          print(report)
          with open('search_report.txt', 'w', encoding='utf-8') as f:
              f.write(report)
          with open('search_urls.txt', 'w', encoding='utf-8') as f:
              for _, href, _ in results:
                  if href:
                      f.write(href + '\n')
          PYEOF

      - name: 下载漫画
        if: ${{ github.event.inputs.mode == 'download' }}
        env:
          URLS: ${{ github.event.inputs.gallery_urls }}
          HAS_COOKIES: ${{ github.event.inputs.cookies }}
        run: |
          mkdir -p "$DL_DIR"
          urls=$(echo "$URLS" | tr ',' '\n')
          for url in $urls; do
            echo "=== 下载: $url ==="
            if [ "$HAS_COOKIES" != "" ]; then
              gallery-dl --cookies "$GITHUB_WORKSPACE/cookies.txt" \
                --directory "$DL_DIR" "$url" 2>&1 | tail -20
            else
              gallery-dl --directory "$DL_DIR" "$url" 2>&1 | tail -20
            fi
          done
          echo "=== 下载完成，文件列表 ==="
          find "$DL_DIR" -type f | head -50

      - name: 打包 ZIP
        if: ${{ github.event.inputs.mode == 'download' && github.event.inputs.output_format == 'zip' }}
        run: |
          cd "$DL_DIR"
          found=0
          for d in */; do
            [ -d "$d" ] || continue
            found=1
            name=$(basename "$d" | sed 's/[/ :*?"<>|]/_/g')
            echo "打包目录: $name"
            cd "$d"
            zip -r -0 "$DL_DIR/../${name}.zip" . 2>&1 | tail -2
            cd "$DL_DIR"
          done
          if [ $found -eq 0 ]; then
            echo "未找到下载目录，检查原始结构"
            find "$DL_DIR" -type f | head -20
          fi
          cd "$DL_DIR/.."
          ls -lh *.zip 2>/dev/null || echo "未生成zip"

      - name: 上传下载文件
        uses: actions/upload-artifact@v4
        with:
          name: ehentai-downloads
          path: |
            downloads/
            *.zip
            search_report.txt
            search_urls.txt
          compression-level: 0
          retention-days: 7
